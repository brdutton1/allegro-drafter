name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test core
        run: dotnet test tests/AllegroDrafter.Core.Tests --nologo
      - name: Build add-in (Revit 2025)
        run: dotnet build src/AllegroDrafter.Revit -c Release -p:RevitVersion=2025 --nologo
      - name: Build add-in (Revit 2026)
        run: dotnet build src/AllegroDrafter.Revit -c Release -p:RevitVersion=2026 --nologo
      - name: Build bridge
        run: dotnet build src/AllegroDrafter.Bridge -c Release --nologo
